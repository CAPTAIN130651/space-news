name: Daily space news (TH)

on:
  schedule:
    - cron: "47 22 * * *"   # 05:47 เวลาไทยทุกวัน
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch & summarize
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          MAX_STORIES: ${{ vars.MAX_STORIES || '8' }}
        run: python scripts/fetch_news.py

      - name: Commit news.json
        run: |
          git config user.name "space-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/news.json
          git diff --staged --quiet || git commit -m "news: $(date -u +%Y-%m-%d)"
          git push
